/* Tipografías de marca Tatan: Doughy (títulos), Nunito (textos), Boyrun (manuscrita) */
@font-face{font-family:Nunito;src:url(fonts/Nunito-Regular.woff2) format('woff2');font-weight:400 500;font-style:normal;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/Nunito-Italic.woff2) format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/Nunito-SemiBold.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/Nunito-Bold.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/Nunito-ExtraBold.woff2) format('woff2');font-weight:800 900;font-style:normal;font-display:swap}
@font-face{font-family:Doughy;src:url(fonts/Doughy.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Boyrun;src:url(fonts/Boyrun.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
/* Layout: app de una columna para el celular, barra de secciones abajo, hojas deslizables para cargar datos */
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --surface-2:#EAEEE5; --ink:#241B1F; --muted:#6D6468; --line:#DCDFD5;
  --accent:#703260; --accent-ink:#FCEFD9; --accent-soft:#FCEFD9; --pista:#81496F; --pista-soft:#EDE5EB; --beige:#FCEFD9; --violeta:#703260;
  --ok:#2E7A4C; --ok-soft:#DFF0E5; --warn:#A86A12; --warn-soft:#FBEBD0; --bad:#B8322A; --bad-soft:#F8DEDB;
  --f-display:"Doughy","Nunito",system-ui,sans-serif; --f-hand:"Boyrun","Nunito",cursive;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(36,27,31,.06), 0 4px 16px rgba(36,27,31,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151216; --surface:#201B21; --surface-2:#2A242B; --ink:#F2EDEF; --muted:#A99FA5; --line:#3A3239;
  --accent:#D9A9CB; --accent-ink:#2A1424; --accent-soft:#3A2434; --pista:#FCEFD9; --pista-soft:#3A3226; --beige:#FCEFD9; --violeta:#703260;
  --ok:#7ACB97; --ok-soft:#1F3427; --warn:#E8B465; --warn-soft:#3B2E1A; --bad:#F08A80; --bad-soft:#3E2220;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151216; --surface:#201B21; --surface-2:#2A242B; --ink:#F2EDEF; --muted:#A99FA5; --line:#3A3239;
  --accent:#D9A9CB; --accent-ink:#2A1424; --accent-soft:#3A2434; --pista:#FCEFD9; --pista-soft:#3A3226; --beige:#FCEFD9; --violeta:#703260;
  --ok:#7ACB97; --ok-soft:#1F3427; --warn:#E8B465; --warn-soft:#3B2E1A; --bad:#F08A80; --bad-soft:#3E2220;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:none;margin:0 auto;padding-left:max(16px,2.2vw,env(safe-area-inset-left,0px));padding-right:max(16px,2.2vw,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:24px;letter-spacing:.01em;line-height:1}
.brand{display:flex;flex-direction:column;align-items:flex-start}.brand .logo{height:34px;width:auto;display:block}.login .logo{height:40px;width:auto;align-self:flex-start;display:block;margin-bottom:2px}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.top .spacer{flex:1}
main{padding-block:16px 120px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a[aria-current="page"]{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--accent)}
h2{font-family:var(--f-display);font-weight:400;font-size:19px}
h3{font-size:15px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:not(.pri):hover{background:var(--accent-soft);border-color:var(--accent-soft)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* Etiquetas de pedidos: cada cosa con su color para diferenciarlas de un vistazo */
.t-pend{background:#E6E9F2;color:#46507A}.t-prod{background:#FDE7D6;color:#A4521B}.t-listo{background:#D8EFEE;color:#1B6E6A}.t-ent{background:#ECEBEA;color:#5F5A57}
.t-local{background:#DFEAF8;color:#2D5C93}.t-wa{background:#DDF6E6;color:#128C4A}.t-fe{background:#703260;color:#FCEFD9}.t-cc{background:#FCEFD9;color:#703260;box-shadow:inset 0 0 0 1px #E9D3B4}
.t-pas{background:#E5DDF3;color:#5B3D8F}.t-iva{background:#EDE5EB;color:#81496F}.t-otro{background:#F6E3E9;color:#9B3D5C}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-neu{background:var(--surface-2);color:var(--muted)}.p-acc{background:var(--accent-soft);color:var(--accent)}.p-pis{background:var(--pista-soft);color:var(--pista)}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px;min-width:0}
textarea.f{min-height:70px;resize:vertical}
label.lb{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.search{position:relative}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
/* Inicio */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar .btn{width:38px;height:38px;padding:0}
.hero{background:var(--ink);color:var(--bg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--f-display);font-size:38px;line-height:1.05}
.hero .sub{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.85}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-size:19px;font-weight:700}
.tiles[style*="repeat(3"] .tile .v{font-size:clamp(14px,4.2vw,19px);white-space:nowrap}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .h{font-size:11.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:9px 11px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick .btn{border-radius:12px;padding:12px 6px;flex-direction:column;gap:4px;font-size:13px}
.quick svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}
/* listas */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.itemwrap{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-right:12px}.itemwrap>.item{border-top:0;flex:1;min-width:0}.itemwrap .ent{flex-shrink:0}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .end{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.datechip{width:46px;flex-shrink:0;text-align:center;border-radius:10px;background:var(--accent-soft);color:var(--accent);padding:5px 0;line-height:1.05}
.datechip b{display:block;font-size:18px}
.datechip span{font-size:10.5px;text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.datechip.today{background:var(--accent);color:var(--accent-ink)}
.group-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 2px 0}
.empty{text-align:center;padding:26px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pista)}
.bar i.low{background:var(--warn)}
.bar i.neg{background:var(--bad)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-top:1px solid var(--line);vertical-align:middle}
.tbl thead th{border-top:0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.subtabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.subtabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:650;font-size:13.5px;cursor:pointer;color:var(--muted)}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.morelist .item .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.morelist .item .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9}
/* hoja */
.sheet-bg{position:fixed;inset:0;background:rgba(20,14,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:min(1000px,96vw);max-height:94%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:20px;max-height:90%}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;min-width:0}
.sheet-b{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-f .grow{flex:1}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1fr 64px 96px 30px;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.line .nm{font-size:13.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.line .nm small{display:block;font-weight:500;color:var(--muted)}
.line input{padding:7px 8px}
.line .rm{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.line.may{grid-template-columns:60px 1fr 92px 96px 26px}
.line.may .imp{text-align:right;font-weight:700;font-size:13.5px}
.may-h{display:grid;grid-template-columns:60px 1fr 92px 96px 26px;gap:6px;font-size:11.5px;padding:0 9px}
.may-h span:nth-child(3),.may-h span:nth-child(4){text-align:right}
@media (max-width:560px){.line.may{grid-template-columns:52px 1fr 80px 26px;row-gap:4px}.line.may .nm{grid-column:2/4;grid-row:1}.line.may .rm{grid-column:4;grid-row:1}.line.may input[data-k=cant]{grid-row:1/3;grid-column:1}.line.may input[data-k=precio]{grid-column:2;grid-row:2}.line.may .imp{grid-column:3/5;grid-row:2;align-self:center}.may-h{display:none}}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.results button{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:13.5px}
.results button:first-child{border-top:0}
.results button:hover{background:var(--surface-2)}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.totals .r{display:flex;justify-content:space-between;gap:10px}
.totals .r.big{font-size:17px;font-weight:700;border-top:1px solid var(--line);padding-top:7px;margin-top:3px}
.pays{display:flex;flex-direction:column;gap:6px}
.pay{display:grid;grid-template-columns:120px 1fr 1fr 30px;gap:6px;align-items:center}
@media (max-width:460px){.pay{grid-template-columns:1fr 1fr 30px}.pay .pf{grid-column:1/-1}}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
/* documento presupuesto */
.doc{background:#FFFFFF;color:#241B1F;border-radius:6px;padding:26px 22px;border:1px solid #E4E0DC;font-size:13.5px}
.doc .dh{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:2px solid #703260;padding-bottom:12px}
.doc .dn{font-family:var(--f-display);font-size:30px;line-height:1}.doc .dn img{height:44px;width:auto;display:block}
.doc .dn small{display:block;font-family:var(--f-body);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#7A6F74;margin-top:5px}
.doc .dt{text-align:right;font-size:12px;color:#7A6F74}
.doc .dt b{display:block;font-size:15px;color:#703260;letter-spacing:.14em;text-transform:uppercase}
.doc .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:14px 0}
.doc .meta div span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7A6F74;font-weight:700}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7A6F74;text-align:left;border-bottom:1px solid #D9D3CF;padding:6px 4px}
.doc td{padding:7px 4px;border-bottom:1px solid #EFEBE8}
.doc td.r,.doc th.r{text-align:right;white-space:nowrap}
.doc .tot{display:flex;justify-content:flex-end;gap:18px;font-size:18px;font-weight:700;padding:12px 4px 2px}
.doc .obs{margin-top:14px;font-size:12.5px;color:#5E5458;white-space:pre-wrap}
.doc .foot{margin-top:18px;padding-top:10px;border-top:1px solid #E4E0DC;font-size:12px;color:#7A6F74;text-align:center}
.cklist{display:flex;flex-direction:column;gap:2px}
.ckrow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14.5px}
.ckrow.done .ckn{text-decoration:line-through;color:var(--muted)}
.ck{width:30px;height:30px;flex-shrink:0;border-radius:9px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;font-size:16px;color:var(--accent-ink);display:grid;place-items:center}
.ck.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.stepper{display:flex;align-items:center;gap:4px;flex-shrink:0}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;cursor:pointer}
.stepper b{min-width:34px;text-align:center;font-size:16px}
.secopt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
